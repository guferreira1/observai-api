root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/observai-api ./cmd/observai-api"
entrypoint = ["./tmp/observai-api"]
delay = 1000
exclude_dir = [".agents", ".claude", ".codex", ".git", ".github", ".idea", ".vscode", "api", "docs", "docker", "migrations", "tmp"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
include_dir = ["agents", "cmd", "config", "internal"]
include_ext = ["env", "go", "md", "yaml", "yml"]
include_file = ["go.mod", "go.sum"]
kill_delay = "0s"
log = "air-build-errors.log"
poll = false
poll_interval = 0
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
