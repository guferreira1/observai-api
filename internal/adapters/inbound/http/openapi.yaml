openapi: 3.1.0
info:
  title: ObservAI API
  version: 0.1.0
  description: |
    Provider-agnostic observability analysis gateway.

    All successful responses are wrapped in `WrapperDtoResponde` with a stable
    `data` and `metadata` envelope. Provider-specific fields never leak into
    the public contract — adapters normalize them into the schemas documented
    below.

    The interaction chat answers only questions related to an active analysis.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: analysis
    description: Create, list and retrieve analyses.
  - name: chat
    description: Scoped conversation about an existing analysis.
  - name: operational
    description: Health, readiness and Prometheus metrics.
paths:
  /health:
    get:
      tags: [operational]
      summary: Application health probe.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_HealthResponse"
  /healthz:
    get:
      tags: [operational]
      summary: Kubernetes liveness probe.
      responses:
        "200":
          description: Process is alive.
  /readyz:
    get:
      tags: [operational]
      summary: Kubernetes readiness probe.
      responses:
        "200":
          description: Dependencies are ready.
        "503":
          description: One or more dependencies are not ready.
  /metrics:
    get:
      tags: [operational]
      summary: Prometheus scrape endpoint.
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
  /v1/openapi.yaml:
    get:
      tags: [operational]
      summary: This OpenAPI specification.
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /v1/analyses:
    post:
      tags: [analysis]
      summary: Submit a new asynchronous analysis job.
      description: |
        Validates the request, creates a `pending` job and returns immediately
        with `202 Accepted`. The client must poll `GET /v1/jobs/{jobID}` until
        the status becomes `completed` or `failed`. The same identifier is
        reused as the final analysis identifier once the worker finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequestDto"
            examples:
              latency-spike:
                summary: Investigate a latency spike.
                value:
                  goal: Identify the cause of the checkout latency spike.
                  timeWindow:
                    start: "2026-05-13T08:00:00Z"
                    end: "2026-05-13T08:30:00Z"
                  affectedServices: ["checkout-api", "payments-gateway"]
                  signals: ["metrics", "logs", "traces"]
                  context: Deploy completed at 07:55 UTC.
      responses:
        "202":
          description: Analysis job accepted; poll the Location URL for completion.
          headers:
            Location:
              schema: { type: string }
              description: URL where the job status can be polled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_AnalysisJobAcceptedDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "499":
          $ref: "#/components/responses/ClientClosedRequest"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [analysis]
      summary: List analyses with pagination and filters.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 0 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
        - in: query
          name: severity
          schema:
            type: string
            enum: [low, medium, high, critical]
        - in: query
          name: service
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of analyses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_AnalysisListResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{jobID}:
    parameters:
      - in: path
        name: jobID
        required: true
        schema: { type: string }
    get:
      tags: [analysis]
      summary: Retrieve the status of an asynchronous analysis job.
      description: |
        Always returns 200 while the job exists; clients inspect `data.status`
        to differentiate pending, running, completed or failed jobs. When the
        job completes, `data.analysisId` points to the final analysis URL.
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_AnalysisJobStatusDto"
        "404":
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/analyses/{analysisID}:
    parameters:
      - $ref: "#/components/parameters/AnalysisID"
    get:
      tags: [analysis]
      summary: Retrieve a previously created analysis.
      responses:
        "200":
          description: Analysis found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_AnalysisResponseDto"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/analyses/{analysisID}/chat:
    parameters:
      - $ref: "#/components/parameters/AnalysisID"
    post:
      tags: [chat]
      summary: Ask a scoped question about an analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequestDto"
            examples:
              in-scope:
                summary: Valid question about the active analysis.
                value:
                  question: Which evidence supports the database saturation hypothesis?
      responses:
        "200":
          description: Scoped answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_ChatResponseDto"
        "400":
          description: Invalid question or out-of-scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
              examples:
                out-of-scope:
                  summary: Question is unrelated to the analysis.
                  value:
                    data:
                      code: question_out_of_scope
                      message: I can only answer questions about the active ObservAI analysis. Ask about the evidence, hypotheses, affected services or recommended investigation steps.
                    metadata:
                      requestId: 0d4f9c43-1f8e-4f02-9b76-37c12f12d8b4
                      processingTimeMs: 3
                      provider: { mode: local }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [chat]
      summary: Retrieve the persisted chat history for an analysis.
      responses:
        "200":
          description: Chat history (oldest first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WrapperDtoResponde_ChatHistoryResponseDto"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    AnalysisID:
      in: path
      name: analysisID
      required: true
      schema:
        type: string
      description: Unique analysis identifier returned by `POST /v1/analyses`.
  responses:
    BadRequest:
      description: The request payload, body or filter is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
          examples:
            invalid-json:
              value:
                data:
                  code: invalid_json
                  message: request body contains unknown field
                  details:
                    - field: severity
                      rule: unknown_field
                metadata:
                  requestId: a1
                  processingTimeMs: 1
                  provider: { mode: local }
            invalid-request:
              value:
                data:
                  code: invalid_request
                  message: request validation failed
                  details:
                    - field: goal
                      rule: required
                metadata:
                  requestId: a2
                  processingTimeMs: 1
                  provider: { mode: local }
            invalid-analysis-filter:
              value:
                data:
                  code: invalid_analysis_filter
                  message: "severity \"unknown\" is not supported"
                metadata:
                  requestId: a3
                  processingTimeMs: 1
                  provider: { mode: local }
    NotFound:
      description: Analysis or analysis context not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
          examples:
            analysis-not-found:
              value:
                data: { code: analysis_not_found, message: analysis not found }
                metadata:
                  requestId: a4
                  processingTimeMs: 0
                  provider: { mode: local }
    PayloadTooLarge:
      description: Request body exceeds the configured size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
          examples:
            too-large:
              value:
                data:
                  code: request_body_too_large
                  message: request body exceeds the configured size limit
                metadata:
                  requestId: a5
                  processingTimeMs: 0
                  provider: { mode: local }
    ClientClosedRequest:
      description: Client closed the connection before the response was sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
    GatewayTimeout:
      description: Server-side processing budget exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
          examples:
            timeout:
              value:
                data:
                  code: request_timeout
                  message: request exceeded the server-side processing budget
                metadata:
                  requestId: a6
                  processingTimeMs: 5000
                  provider: { mode: local }
    InternalError:
      description: Unexpected internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperDtoResponde_ErrorResponse"
          examples:
            internal:
              value:
                data: { code: internal_error, message: internal server error }
                metadata:
                  requestId: a7
                  processingTimeMs: 1
                  provider: { mode: local }
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ResponseMetadata:
      type: object
      required: [requestId, processingTimeMs, provider]
      properties:
        requestId:
          type: string
          description: Correlation identifier echoed back in the `X-Request-Id` header.
        processingTimeMs:
          type: integer
          format: int64
          description: Server-side processing time in milliseconds.
        provider:
          $ref: "#/components/schemas/ProviderSummary"
        warnings:
          type: array
          items: { type: string }
        pagination:
          $ref: "#/components/schemas/Pagination"
    ProviderSummary:
      type: object
      required: [mode]
      properties:
        observability:
          type: array
          items: { type: string }
        llm:
          type: string
        mode:
          type: string
          description: Deployment mode (`local`, `dev`, `prod`).
    Pagination:
      type: object
      required: [limit, offset]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        next:
          type: string
          description: Path + query for the next page or empty when no more pages remain.
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Stable values:
            `invalid_analysis_request`, `invalid_analysis_filter`,
            `invalid_chat_question`, `question_out_of_scope`, `invalid_json`,
            `invalid_request`, `analysis_not_found`,
            `analysis_context_not_found`, `request_body_too_large`,
            `request_canceled`, `request_timeout`, `internal_error`.
          enum:
            - invalid_analysis_request
            - invalid_analysis_filter
            - invalid_chat_question
            - question_out_of_scope
            - invalid_json
            - invalid_request
            - analysis_not_found
            - analysis_context_not_found
            - analysis_job_not_found
            - request_body_too_large
            - request_canceled
            - request_timeout
            - not_found
            - internal_error
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDetail"
    ErrorFieldDetail:
      type: object
      required: [field, rule]
      properties:
        field: { type: string }
        rule: { type: string }
        message: { type: string }
    AnalysisRequestDto:
      type: object
      required: [goal, affectedServices]
      properties:
        goal:
          type: string
          description: Free-form description of the analysis objective.
        timeWindow:
          $ref: "#/components/schemas/TimeDto"
        affectedServices:
          type: array
          items: { type: string }
        signals:
          type: array
          items:
            type: string
            enum: [logs, metrics, traces, apm]
        context:
          type: string
    TimeDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AnalysisResponseDto:
      type: object
      required:
        - id
        - summary
        - severity
        - confidence
        - affectedServices
        - evidence
        - detectedAnomalies
        - possibleRootCauses
        - recommendedActions
        - codeLevelInsights
        - missingEvidence
        - createdAt
      properties:
        id: { type: string }
        summary: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
        confidence:
          type: string
          enum: [low, medium, high]
        affectedServices:
          type: array
          items: { type: string }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceDto"
        detectedAnomalies:
          type: array
          items: { type: string }
        possibleRootCauses:
          type: array
          items:
            $ref: "#/components/schemas/RootCauseHypothesisDto"
        recommendedActions:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationDto"
        codeLevelInsights:
          type: array
          items: { type: string }
        missingEvidence:
          type: array
          items: { type: string }
        createdAt:
          type: string
          format: date-time
    AnalysisListResponseDto:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisResponseDto"
    EvidenceDto:
      type: object
      required: [signal, service, source, name, summary, observed, score]
      properties:
        signal:
          type: string
          enum: [logs, metrics, traces, apm]
        service: { type: string }
        source: { type: string }
        name: { type: string }
        summary: { type: string }
        observed:
          type: string
          format: date-time
        score:
          type: number
          format: double
        unit: { type: string }
        reference: { type: string }
        provider: { type: string }
        query: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
    RootCauseHypothesisDto:
      type: object
      required: [cause, evidence, confidence]
      properties:
        cause: { type: string }
        evidence:
          type: array
          items: { type: string }
        confidence:
          type: string
          enum: [low, medium, high]
    RecommendationDto:
      type: object
      required: [action, rationale, priority]
      properties:
        action: { type: string }
        rationale: { type: string }
        priority:
          type: integer
          description: Lower numbers indicate higher priority (1 is most important).
    ChatRequestDto:
      type: object
      required: [question]
      properties:
        question: { type: string }
    ChatResponseDto:
      type: object
      required: [analysisId, answer, evidence]
      properties:
        analysisId: { type: string }
        answer: { type: string }
        evidence:
          type: array
          items: { type: string }
    ChatHistoryResponseDto:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageDto"
    ChatMessageDto:
      type: object
      required: [id, analysisId, role, content, createdAt]
      properties:
        id: { type: string }
        analysisId: { type: string }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        evidence:
          type: array
          items: { type: string }
        createdAt:
          type: string
          format: date-time
    WrapperDtoResponde_HealthResponse:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/HealthResponse"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    WrapperDtoResponde_AnalysisResponseDto:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/AnalysisResponseDto"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    WrapperDtoResponde_AnalysisListResponseDto:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/AnalysisListResponseDto"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    WrapperDtoResponde_ChatResponseDto:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/ChatResponseDto"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    WrapperDtoResponde_ChatHistoryResponseDto:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/ChatHistoryResponseDto"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    WrapperDtoResponde_ErrorResponse:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/ErrorResponse"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    AnalysisJobAcceptedDto:
      type: object
      required: [jobId, status, statusUrl]
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed]
        statusUrl:
          type: string
          description: Relative URL the client should poll until the job finishes.
    AnalysisJobStatusDto:
      type: object
      required: [jobId, status, attempt, createdAt]
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed]
        analysisId:
          type: string
          description: Populated once the job completes; same value as `jobId`.
        analysisUrl:
          type: string
          description: Relative URL for the final analysis once the job completes.
        errorMessage:
          type: string
          description: Populated only when status is `failed`.
        attempt: { type: integer }
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    WrapperDtoResponde_AnalysisJobAcceptedDto:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/AnalysisJobAcceptedDto"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
    WrapperDtoResponde_AnalysisJobStatusDto:
      type: object
      required: [data, metadata]
      properties:
        data:
          $ref: "#/components/schemas/AnalysisJobStatusDto"
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
