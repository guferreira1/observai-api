name: API CD
run-name: API CD - ${{ inputs.image_tag }}

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish. Example: v0.1.0"
        required: true
        type: string
      publish_latest:
        description: "Also publish the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: api-cd-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: observai/observai-api

jobs:
  publish:
    name: Build and publish API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid image tag. Use semantic versioning, for example: v0.1.0 or 0.1.0-alpha.1"
            exit 1
          fi
          if [[ "$PUBLISH_LATEST" == "true" && "$IMAGE_TAG" == *-* ]]; then
            echo "Pre-release image tags must not publish latest."
            exit 1
          fi

      - name: Generate changelog by GitHub user
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CHANGELOG_OUTPUT: release-notes.md
        run: node .github/scripts/changelog-by-user.mjs

      - name: Upload generated changelog
        uses: actions/upload-artifact@v4
        with:
          name: api-release-notes-${{ inputs.image_tag }}
          path: release-notes.md
          if-no-files-found: error

      - name: Set Docker tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          semver='^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9.-]+)?$'
          if [[ ! "$IMAGE_TAG" =~ $semver ]]; then
            echo "Invalid image tag. Use semantic versioning, for example: v0.1.0 or 0.1.0-alpha.1"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          prerelease="${BASH_REMATCH[4]}"
          prefix=""
          if [[ "$IMAGE_TAG" == v* ]]; then
            prefix="v"
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${IMAGE_TAG}"
            if [ -z "$prerelease" ]; then
              echo "${IMAGE_NAME}:${prefix}${major}.${minor}"
            fi
            if [ "$PUBLISH_LATEST" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ObservAI API
            org.opencontainers.image.description=Open-source AI gateway for observability analysis.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          build-args: |
            VERSION=${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
