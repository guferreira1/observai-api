name: API CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Go project
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: observai
          POSTGRES_PASSWORD: observai
          POSTGRES_DB: observai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observai -d observai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Go project
        id: detect
        shell: bash
        run: |
          if [ -f "go.mod" ]; then
            echo "go_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.detect.outputs.go_project == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        if: steps.detect.outputs.go_project == 'true'
        run: go mod download

      - name: Install validation tools
        if: steps.detect.outputs.go_project == 'true'
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0

      - name: Format check
        if: steps.detect.outputs.go_project == 'true'
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        if: steps.detect.outputs.go_project == 'true'
        run: go vet ./...

      - name: golangci-lint
        if: steps.detect.outputs.go_project == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: sqlc compile
        if: steps.detect.outputs.go_project == 'true'
        run: sqlc compile

      - name: sqlc generated diff
        if: steps.detect.outputs.go_project == 'true'
        run: sqlc diff

      - name: Migration check
        if: steps.detect.outputs.go_project == 'true'
        env:
          OBSERVAI_TEST_DATABASE_DSN: postgres://observai:observai@localhost:5432/observai?sslmode=disable
        run: |
          migrate -path migrations -database "$OBSERVAI_TEST_DATABASE_DSN" up
          migrate -path migrations -database "$OBSERVAI_TEST_DATABASE_DSN" down -all

      - name: Test
        if: steps.detect.outputs.go_project == 'true'
        env:
          OBSERVAI_TEST_DATABASE_DSN: postgres://observai:observai@localhost:5432/observai?sslmode=disable
        run: |
          migrate -path migrations -database "$OBSERVAI_TEST_DATABASE_DSN" up
          go test ./... -race -coverprofile=coverage.out

      - name: Build
        if: steps.detect.outputs.go_project == 'true'
        run: go build ./...

      - name: Skip validation
        if: steps.detect.outputs.go_project == 'false'
        run: echo "go.mod not found yet. Skipping Go validation until the project is initialized."
