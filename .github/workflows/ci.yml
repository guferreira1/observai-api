name: API CI
run-name: API CI - ${{ github.ref_name }}

"on":
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OBSERVAI_TEST_DATABASE_DSN: postgres://observai:observai@localhost:5432/observai?sslmode=disable
  OBSERVAI_TEST_REDIS_URL: redis://localhost:6379/0

jobs:
  validate:
    name: Validate Go source
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: observai
          POSTGRES_PASSWORD: observai
          POSTGRES_DB: observai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observai -d observai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install validation tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.1
          args: --timeout=5m

      - name: Validate sqlc configuration
        run: sqlc compile

      - name: Check generated sqlc code is committed
        run: |
          sqlc generate
          git diff --exit-code -- internal/adapters/outbound/postgres/sqlc

      - name: Validate database migrations
        run: |
          migrate -path migrations -database "$OBSERVAI_TEST_DATABASE_DSN" up
          migrate -path migrations -database "$OBSERVAI_TEST_DATABASE_DSN" down -all

      - name: Test
        run: |
          migrate -path migrations -database "$OBSERVAI_TEST_DATABASE_DSN" up
          go test ./... -race -count=1 -coverprofile=coverage.out

      - name: HTTP integration tests
        env:
          OBSERVAI_TEST_TESTCONTAINERS: "1"
        run: go test -tags=integration ./internal/adapters/inbound/http -count=1 -run Integration

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Build Go packages
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: observai-api:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
